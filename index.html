<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, touch-action=none">
    <title>My Custom Desk</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c2c2c">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { --bg-color: #2c2c2c; --paper-bg: #ffffff; --grid-border: #d0d0d0; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; user-select: none; -webkit-touch-callout: none; }
        #toolbar { position: fixed; top: 20px; left: 20px; z-index: 100; background: rgba(40, 40, 40, 0.9); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; flex-wrap: wrap; gap: 15px; color: white; align-items: center; transform: translateZ(0); }
        input, button, select { padding: 8px 12px; border-radius: 8px; border: none; background: #4a4a4a; color: white; cursor: pointer; font-weight: 600; outline: none; transition: all 0.2s; }
        button:hover, select:hover { background: #5a5a5a; }
        #erase-btn { background: #34495e; }
        #erase-btn.active { background: #f39c12; box-shadow: 0 0 12px rgba(243, 156, 18, 0.6); color: black; }
        #viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; cursor: grab; touch-action: none; overflow: hidden; }
        #viewport:active { cursor: grabbing; }
        #viewport.erasing-mode { cursor: not-allowed; } 
        #canvas-desk { position: absolute; top: 0; left: 0; transform-origin: 0 0; display: grid; gap: 120px; padding: 150px; width: max-content; will-change: transform; }
        .chunk-group { display: grid; gap: 1px; background: var(--grid-border); border: 1px solid var(--grid-border); border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        
        .page-node { position: relative; background: var(--paper-bg); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        /* 💡 수정된 부분: object-fit 속성을 주어 비율이 강제로 찌그러지지 않게 방어 */
        .page-node canvas { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .page-node.empty { background: #f8f9fa; }
        
        .mask-box { position: absolute; background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(4px); border: 2px solid #2c3e50; border-radius: 4px; cursor: pointer; z-index: 20; transition: opacity 0.1s ease; touch-action: none; }
        .mask-box:active, .mask-box.revealed { opacity: 0.1; }
        .erase-active .mask-box:hover { background: rgba(231, 76, 60, 0.8); border-color: #c0392b; }
        .page-label { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.85); color: #333; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="file" id="file-input" accept="application/pdf" />
        <select id="chunk-size">
            <option value="1">1장씩 보기</option>
            <option value="2">2장씩 묶기</option>
            <option value="4" selected>4장씩 묶기</option>
            <option value="6">6장씩 묶기</option>
            <option value="8">8장씩 묶기</option>
        </select>
        <select id="desk-columns">
            <option value="4" selected>가로 4묶음</option>
            <option value="8">가로 8묶음</option>
            <option value="8">가로 12묶음</option>
        </select>
        <button id="reset-btn">책상 핏 맞추기</button>
        <div style="width: 2px; height: 20px; background: #666; margin: 0 5px;"></div>
        <button id="erase-btn">🧽 지우개</button>
    </div>
    <div id="viewport">
        <div id="canvas-desk"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const viewport = document.getElementById('viewport');
        const desk = document.getElementById('canvas-desk');
        let pdfDoc = null, scale = 0.2, panX = 100, panY = 100;
        
        const eraseBtn = document.getElementById('erase-btn');
        let isEraseMode = false, eraseTimer = null, eraseLongPressed = false;

        eraseBtn.addEventListener('contextmenu', e => e.preventDefault());
        eraseBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            eraseLongPressed = false;
            eraseTimer = setTimeout(() => {
                eraseLongPressed = true;
                if (confirm("책상 위의 모든 가림막을 완전히 지우시겠습니까?")) {
                    document.querySelectorAll('.mask-box').forEach(mask => mask.remove());
                }
            }, 500); 
        });
        eraseBtn.addEventListener('pointerup', (e) => {
            clearTimeout(eraseTimer);
            if (!eraseLongPressed) { 
                isEraseMode = !isEraseMode;
                eraseBtn.classList.toggle('active', isEraseMode);
                viewport.classList.toggle('erasing-mode', isEraseMode);
                viewport.classList.toggle('erase-active', isEraseMode);
            }
        });
        eraseBtn.addEventListener('pointerleave', () => clearTimeout(eraseTimer));

        const renderObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const canvas = entry.target;
                const pageNum = parseInt(canvas.dataset.pageNumber);
                
                if (entry.isIntersecting) {
                    if (canvas.dataset.rendering === "true" || canvas.dataset.rendered === "true") return;
                    
                    canvas.dataset.rendering = "true";
                    pdfDoc.getPage(pageNum).then(page => {
                        const vp = page.getViewport({ scale: 1.0 }); 
                        
                        // 💡 핵심 수정: 해당 페이지의 정확한 비율로 뼈대(Wrapper) 높이를 즉각 재조정
                        const pageRatio = vp.height / vp.width;
                        canvas.parentElement.style.height = `${450 * pageRatio}px`;

                        canvas.width = vp.width;
                        canvas.height = vp.height;
                        
                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.fillStyle = "white";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        const renderTask = page.render({ canvasContext: ctx, viewport: vp });
                        renderTask.promise.then(() => {
                            canvas.dataset.rendered = "true";
                            canvas.dataset.rendering = "false";
                            page.cleanup(); 
                        });
                    });
                } else {
                    if (canvas.dataset.rendered === "true") {
                        canvas.width = 1;
                        canvas.height = 1;
                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.clearRect(0, 0, 1, 1);
                        canvas.dataset.rendered = "false";
                        canvas.dataset.rendering = "false";
                    }
                }
            });
        }, { root: viewport, rootMargin: "600px" });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const fileReader = new FileReader();
            fileReader.onload = function() {
                pdfjsLib.getDocument(new Uint8Array(this.result)).promise.then(pdf => {
                    pdfDoc = pdf;
                    renderAllPagesInChunks();
                });
            };
            fileReader.readAsArrayBuffer(file);
        });

        document.getElementById('chunk-size').addEventListener('change', () => { if (pdfDoc) renderAllPagesInChunks(); });
        document.getElementById('desk-columns').addEventListener('change', () => {
            if (pdfDoc) {
                desk.style.gridTemplateColumns = `repeat(${document.getElementById('desk-columns').value}, max-content)`;
                resetView();
            }
        });

        async function renderAllPagesInChunks() {
            desk.innerHTML = '';
            desk.style.gridTemplateColumns = `repeat(${document.getElementById('desk-columns').value}, max-content)`;
            const chunkSize = parseInt(document.getElementById('chunk-size').value);
            const columns = chunkSize === 1 ? 1 : 2; 
            
            if (pdfDoc.numPages === 0) return;

            // 1페이지 비율로 대략적인 초기값 세팅 (개별 렌더링 시 정확히 수정됨)
            const firstPage = await pdfDoc.getPage(1);
            const initialVp = firstPage.getViewport({ scale: 1.0 });
            const initialRatio = initialVp.height / initialVp.width;
            firstPage.cleanup(); 

            let currentGroup = null;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                if ((i - 1) % chunkSize === 0) {
                    currentGroup = document.createElement('div');
                    currentGroup.className = 'chunk-group';
                    currentGroup.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
                    desk.appendChild(currentGroup);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'page-node';
                wrapper.style.width = '450px';
                wrapper.style.height = `${450 * initialRatio}px`; 
                
                const canvas = document.createElement('canvas');
                canvas.dataset.pageNumber = i; 
                canvas.dataset.rendered = "false";
                
                const label = document.createElement('div');
                label.className = 'page-label';
                label.textContent = i;

                wrapper.appendChild(canvas);
                wrapper.appendChild(label);
                currentGroup.appendChild(wrapper);

                renderObserver.observe(canvas);
            }
            setTimeout(resetView, 100);
        }

        let isTransformUpdating = false;
        function updateTransform() { 
            if (!isTransformUpdating) {
                requestAnimationFrame(() => {
                    desk.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
                    isTransformUpdating = false;
                });
                isTransformUpdating = true;
            }
        }

        let actionState = 'none'; 
        let startEvent = null, pressTimer = null;
        let startX, startY, drawStartX, drawStartY, activeMask, activePage;
        const LONG_PRESS_MS = 300; 
        const DRAG_THRESHOLD = 10; 

        const activePointers = new Map();
        let initialPinchDistance = null;
        let lastPinchCenter = { x: 0, y: 0 };

        viewport.addEventListener('contextmenu', e => e.preventDefault());
        
        viewport.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (e.target.closest('#toolbar')) return;

            if (isEraseMode) {
                if (e.target.classList.contains('mask-box')) e.target.remove();
                return;
            }
            if (e.target.classList.contains('mask-box')) return;

            activePointers.set(e.pointerId, e);
            viewport.setPointerCapture(e.pointerId);

            if (activePointers.size === 2) {
                clearTimeout(pressTimer);
                actionState = 'pinch';
                const pts = Array.from(activePointers.values());
                initialPinchDistance = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                lastPinchCenter = {
                    x: (pts[0].clientX + pts[1].clientX) / 2,
                    y: (pts[0].clientY + pts[1].clientY) / 2
                };
                
                if (activeMask && parseInt(activeMask.style.width) === 0) {
                    activeMask.remove();
                    activeMask = null;
                    activePage = null;
                }
                return;
            }

            if (activePointers.size === 1) {
                actionState = 'pending';
                startEvent = { clientX: e.clientX, clientY: e.clientY };
                startX = e.clientX - panX;
                startY = e.clientY - panY;

                const page = e.target.closest('.page-node');

                pressTimer = setTimeout(() => {
                    if (actionState === 'pending') {
                        if (page) {
                            actionState = 'draw';
                            activePage = page;
                            const rect = activePage.getBoundingClientRect();
                            drawStartX = (e.clientX - rect.left) / scale;
                            drawStartY = (e.clientY - rect.top) / scale;

                            activeMask = document.createElement('div');
                            activeMask.className = 'mask-box';
                            activeMask.style.left = drawStartX + 'px';
                            activeMask.style.top = drawStartY + 'px';
                            activeMask.style.width = '0px';
                            activeMask.style.height = '0px';

                            activeMask.addEventListener('pointerdown', function(ev) {
                                if (isEraseMode) { ev.stopPropagation(); this.remove(); return; }
                                ev.stopPropagation();
                                this.classList.add('revealed');
                            });
                            activeMask.addEventListener('pointerup', function(ev) { this.classList.remove('revealed'); });
                            activeMask.addEventListener('pointerleave', function(ev) { this.classList.remove('revealed'); });

                            activePage.appendChild(activeMask);
                            document.body.style.cursor = 'crosshair';
                            if (navigator.vibrate) navigator.vibrate(30);
                        } else {
                            actionState = 'pan';
                        }
                    }
                }, LONG_PRESS_MS);
            }
        });

        viewport.addEventListener('pointermove', (e) => {
            if (activePointers.has(e.pointerId)) {
                activePointers.set(e.pointerId, e);
            }

            if (actionState === 'none') return;

            if (actionState === 'pinch' && activePointers.size === 2) {
                const pts = Array.from(activePointers.values());
                const dist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                const centerX = (pts[0].clientX + pts[1].clientX) / 2;
                const centerY = (pts[0].clientY + pts[1].clientY) / 2;

                if (initialPinchDistance) {
                    const scaleDelta = dist / initialPinchDistance;
                    let newScale = Math.max(0.02, Math.min(scale * scaleDelta, 3));

                    const rect = viewport.getBoundingClientRect();
                    const mouseX = lastPinchCenter.x - rect.left;
                    const mouseY = lastPinchCenter.y - rect.top;

                    let newPanX = mouseX - (mouseX - panX) * (newScale / scale);
                    let newPanY = mouseY - (mouseY - panY) * (newScale / scale);

                    newPanX += (centerX - lastPinchCenter.x);
                    newPanY += (centerY - lastPinchCenter.y);

                    panX = newPanX;
                    panY = newPanY;
                    scale = newScale;
                    updateTransform();
                }
                initialPinchDistance = dist;
                lastPinchCenter = { x: centerX, y: centerY };
                return;
            }

            if (actionState === 'pending') {
                const dx = e.clientX - startEvent.clientX;
                const dy = e.clientY - startEvent.clientY;
                if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
                    clearTimeout(pressTimer);
                    actionState = 'pan';
                }
            }

            if (actionState === 'pan') {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            } else if (actionState === 'draw' && activeMask && activePage) {
                const rect = activePage.getBoundingClientRect();
                const currentX = (e.clientX - rect.left) / scale;
                const currentY = (e.clientY - rect.top) / scale;

                const width = Math.abs(currentX - drawStartX);
                const height = Math.abs(currentY - drawStartY);
                const left = Math.min(currentX, drawStartX);
                const top = Math.min(currentY, drawStartY);

                activeMask.style.left = left + 'px';
                activeMask.style.top = top + 'px';
                activeMask.style.width = width + 'px';
                activeMask.style.height = height + 'px';
            }
        });

        const handlePointerUp = (e) => {
            activePointers.delete(e.pointerId);
            
            try { viewport.releasePointerCapture(e.pointerId); } catch(err) {}

            if (actionState === 'pinch') {
                if (activePointers.size < 2) {
                    initialPinchDistance = null;
                    actionState = 'none'; 
                }
                return;
            }

            clearTimeout(pressTimer);
            document.body.style.cursor = '';

            if (actionState === 'draw') {
                if (activeMask && (parseInt(activeMask.style.width) < 15 || parseInt(activeMask.style.height) < 15)) {
                    activeMask.remove(); 
                }
                activeMask = null;
                activePage = null;
            }

            if (activePointers.size === 0) {
                actionState = 'none';
            }
        };

        viewport.addEventListener('pointerup', handlePointerUp);
        viewport.addEventListener('pointercancel', handlePointerUp);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = -e.deltaY * 0.001;
            let newScale = Math.max(0.02, Math.min(scale * Math.exp(delta), 3)); 
            const rect = viewport.getBoundingClientRect();
            panX = (e.clientX - rect.left) - ((e.clientX - rect.left) - panX) * (newScale / scale);
            panY = (e.clientY - rect.top) - ((e.clientY - rect.top) - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        function resetView() {
            if (!pdfDoc) return;
            const deskW = desk.offsetWidth, deskH = desk.offsetHeight;
            const scaleX = window.innerWidth / (deskW + 100), scaleY = window.innerHeight / (deskH + 100);
            scale = Math.max(Math.min(scaleX, scaleY, 0.4), 0.02); 
            panX = (window.innerWidth - deskW * scale) / 2;
            panY = (window.innerHeight - deskH * scale) / 2;
            desk.style.transition = 'transform 0.4s ease-out';
            updateTransform();
            setTimeout(() => { desk.style.transition = ''; }, 400);
        }
        document.getElementById('reset-btn').addEventListener('click', resetView);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW registered!', reg.scope))
                    .catch(err => console.log('SW fail:', err));
            });
        }
    </script>
</body>
</html>
